<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <radialGradient id="bggrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#16091f"/>
      <stop offset="100%" stop-color="#0d0914"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b26c86" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b26c86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="700" height="380" rx="10" fill="url(#bggrad)"/>
  <ellipse cx="350" cy="0" rx="300" ry="70" fill="#4b3d4f" opacity="0.15"/>

  <!-- border -->
  <rect x="1.5" y="1.5" width="697" height="377" rx="9" fill="none" stroke="#4b3d4f" stroke-width="1"/>

  <!-- top bar -->
  <circle cx="20" cy="18" r="4" fill="#b26c86" opacity="0.7"/>
  <circle cx="34" cy="18" r="4" fill="#868092" opacity="0.5"/>
  <circle cx="48" cy="18" r="4" fill="#4b3d4f" opacity="0.6"/>
  <text x="350" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f" letter-spacing="2">projects</text>
  <line x1="0" y1="30" x2="700" y2="30" stroke="#4b3d4f" stroke-width="0.5" opacity="0.6"/>

  <!-- ── PROJECT 1 ── -->
  <!-- label tag -->
  <rect x="36" y="46" width="42" height="16" rx="3" fill="#4b3d4f" opacity="0.6"/>
  <text x="57" y="58" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#b26c86">web</text>

  <text x="88" y="58" font-family="'Courier New',monospace" font-size="13" fill="#e2c2d2">portfolio</text>

  <!-- arrow + link -->
  <text x="36" y="76" font-family="'Courier New',monospace" font-size="11" fill="#868092">  ──›  </text>
  <text x="86" y="76" font-family="'Courier New',monospace" font-size="11" fill="#b26c86">tamarabereznakova.github.io</text>

  <!-- tech stack -->
  <text x="36" y="93" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f">  { </text>
  <text x="60" y="93" font-family="'Courier New',monospace" font-size="10" fill="#868092">HTML · CSS · JS</text>
  <text x="167" y="93" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f"> }</text>

  <!-- divider -->
  <line x1="36" y1="106" x2="664" y2="106" stroke="#4b3d4f" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- ── PROJECT 2 ── -->
  <rect x="36" y="116" width="46" height="16" rx="3" fill="#4b3d4f" opacity="0.6"/>
  <text x="59" y="128" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#b26c86">java</text>

  <text x="92" y="128" font-family="'Courier New',monospace" font-size="13" fill="#e2c2d2">slitherlink</text>

  <text x="36" y="146" font-family="'Courier New',monospace" font-size="11" fill="#868092">  ──›  </text>
  <text x="86" y="146" font-family="'Courier New',monospace" font-size="11" fill="#b26c86">slitherlinko.onrender.com</text>

  <text x="36" y="163" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f">  { </text>
  <text x="60" y="163" font-family="'Courier New',monospace" font-size="10" fill="#868092">Java · Spring Boot · PostgreSQL</text>
  <text x="283" y="163" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f"> }</text>

  <!-- divider -->
  <line x1="36" y1="176" x2="664" y2="176" stroke="#4b3d4f" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- ── PROJECT 3 ── -->
  <rect x="36" y="186" width="34" height="16" rx="3" fill="#4b3d4f" opacity="0.6"/>
  <text x="53" y="198" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#b26c86">py</text>

  <text x="80" y="198" font-family="'Courier New',monospace" font-size="13" fill="#e2c2d2">it4kt-builder</text>

  <text x="36" y="216" font-family="'Courier New',monospace" font-size="11" fill="#868092">  ──›  </text>
  <text x="86" y="216" font-family="'Courier New',monospace" font-size="11" fill="#b26c86">github.com/tamarabereznakova</text>

  <text x="36" y="233" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f">  { </text>
  <text x="60" y="233" font-family="'Courier New',monospace" font-size="10" fill="#868092">Python · Markdown → HTML · CLI</text>
  <text x="257" y="233" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f"> }</text>

  <!-- divider -->
  <line x1="36" y1="246" x2="664" y2="246" stroke="#4b3d4f" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- ── PROJECT 4 ── -->
  <rect x="36" y="256" width="46" height="16" rx="3" fill="#4b3d4f" opacity="0.6"/>
  <text x="59" y="268" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#b26c86">unity</text>

  <text x="92" y="268" font-family="'Courier New',monospace" font-size="13" fill="#e2c2d2">pixel art game</text>

  <!-- in progress indicator -->
  <text x="36" y="286" font-family="'Courier New',monospace" font-size="11" fill="#868092">  ──›  </text>
  <text x="86" y="286" font-family="'Courier New',monospace" font-size="11" fill="#4b3d4f">in progress</text>

  <!-- pulsing dots -->
  <circle cx="192" cy="282" r="2.5" fill="#b26c86">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="201" cy="282" r="2.5" fill="#b26c86">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="282" r="2.5" fill="#b26c86">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <text x="36" y="303" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f">  { </text>
  <text x="60" y="303" font-family="'Courier New',monospace" font-size="10" fill="#868092">Unity · C# · 2D pixel art</text>
  <text x="222" y="303" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f"> }</text>

  <!-- bottom divider -->
  <line x1="36" y1="320" x2="664" y2="320" stroke="#4b3d4f" stroke-width="0.5" opacity="0.4"/>

  <!-- footer comment -->
  <text x="36" y="345" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f">// more coming  </text>

  <!-- blink cursor -->
  <rect x="148" y="333" width="6" height="12" fill="#b26c86" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- decorative sparkle top right -->
  <text x="655" y="60" font-family="serif" font-size="14" fill="#b26c86" opacity="0.4">✦</text>
  <text x="640" y="320" font-family="serif" font-size="10" fill="#4b3d4f" opacity="0.5">✿</text>
</svg>
