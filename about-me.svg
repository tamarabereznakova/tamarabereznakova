<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240">
  <defs>
    <radialGradient id="bggrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#16091f"/>
      <stop offset="100%" stop-color="#0d0914"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="700" height="240" rx="10" fill="url(#bggrad)"/>

  <!-- subtle top glow -->
  <ellipse cx="350" cy="0" rx="300" ry="60" fill="#4b3d4f" opacity="0.18"/>

  <!-- border -->
  <rect x="1.5" y="1.5" width="697" height="237" rx="9" fill="none" stroke="#4b3d4f" stroke-width="1"/>

  <!-- top bar dots -->
  <circle cx="20" cy="18" r="4" fill="#b26c86" opacity="0.7"/>
  <circle cx="34" cy="18" r="4" fill="#868092" opacity="0.5"/>
  <circle cx="48" cy="18" r="4" fill="#4b3d4f" opacity="0.6"/>
  <!-- top bar label -->
  <text x="350" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#4b3d4f" letter-spacing="2">about me</text>
  <!-- divider line -->
  <line x1="0" y1="30" x2="700" y2="30" stroke="#4b3d4f" stroke-width="0.5" opacity="0.6"/>

  <!-- comment line -->
  <text x="36" y="58" font-family="'Courier New',monospace" font-size="12" fill="#4b3d4f">// tamara.json</text>

  <!-- opening brace -->
  <text x="36" y="78" font-family="'Courier New',monospace" font-size="13" fill="#868092">{</text>

  <!-- line 1 -->
  <text x="60" y="98" font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#b26c86">study</tspan>
    <tspan fill="#868092">  :  </tspan>
    <tspan fill="#e2c2d2">"3rd yr Cybersecurity @ TUKE, Košice"</tspan>
    <tspan fill="#4b3d4f">,</tspan>
  </text>

  <!-- line 2 -->
  <text x="60" y="118" font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#b26c86">focus</tspan>
    <tspan fill="#868092">  :  </tspan>
    <tspan fill="#e2c2d2">"network security · software · game dev"</tspan>
    <tspan fill="#4b3d4f">,</tspan>
  </text>

  <!-- line 3 -->
  <text x="60" y="138" font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#b26c86">teach</tspan>
    <tspan fill="#868092">  :  </tspan>
    <tspan fill="#e2c2d2">"kids to code @ Algonova"</tspan>
    <tspan fill="#4b3d4f">,</tspan>
  </text>

  <!-- line 4 -->
  <text x="60" y="158" font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#b26c86">loves</tspan>
    <tspan fill="#868092">  :  </tspan>
    <tspan fill="#e2c2d2">"astrophysics · pixel art · nature · design"</tspan>
    <tspan fill="#4b3d4f">,</tspan>
  </text>

  <!-- line 5 -->
  <text x="60" y="178" font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#b26c86">loc</tspan>
    <tspan fill="#868092">     :  </tspan>
    <tspan fill="#e2c2d2">"planet Earth"</tspan>
  </text>

  <!-- closing brace -->
  <text x="36" y="198" font-family="'Courier New',monospace" font-size="13" fill="#868092">}</text>

  <!-- bottom comment -->
  <text x="36" y="220" font-family="'Courier New',monospace" font-size="11" fill="#4b3d4f">// currently: figuring it out ✦</text>

  <!-- cursor blink -->
  <rect x="310" y="208" width="7" height="13" fill="#b26c86" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
